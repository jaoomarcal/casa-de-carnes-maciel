# Faz uma leitura simples no Supabase de tempos em tempos para o projeto
# nao ser pausado por inatividade (planos gratuitos pausam apos ~7 dias
# sem nenhuma requisicao). A chave usada aqui e a "publishable" (anon),
# a mesma que ja fica exposta no site publico - sem risco expor ela aqui.
name: Supabase Heartbeat

on:
  schedule:
    # a cada 3 dias, com folga em relacao ao limite de 7 dias do Supabase
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco (select simples)
        run: |
          curl -sf "https://amdazeudrxpyjvhfngue.supabase.co/rest/v1/produtos?select=id&limit=1" \
            -H "apikey: sb_publishable_Jv6cEYwhW4S6XZyj2DM2BA_lcyyTIx3" \
            -H "Authorization: Bearer sb_publishable_Jv6cEYwhW4S6XZyj2DM2BA_lcyyTIx3"
